name: Compilar G3A
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar compilador y librerias fx-CG50
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-sh-elf binutils-sh-elf cmake build-essential libpng-dev
          for tool in gcc g++ ar as ld objcopy ranlib strip; do
            sudo ln -sf /usr/bin/sh-elf-$tool /usr/local/bin/prizm-$tool
          done
          git clone https://github.com/gbl08ma/libfxcg.git /tmp/libfxcg
          make -C /tmp/libfxcg
          if git clone https://github.com/taricorp/mkg3a.git /tmp/mkg3a; then
            cmake -B /tmp/mkg3a/build -S /tmp/mkg3a && cmake --build /tmp/mkg3a/build
          fi
      - name: Compilar VIGAS.g3a
        run: |
          cat << 'EOF' > /tmp/math_shim.c
          #include <stddef.h>
          double fabs(double x) { return x < 0.0 ? -x : x; }
          double round(double x) { return x >= 0.0 ? (double)(long long)(x + 0.5) : (double)(long long)(x - 0.5); }
          double sqrt(double x) {
            if (x <= 0.0) return 0.0;
            double r = x > 1.0 ? x : 1.0;
            for (int i = 0; i < 30; i++) r = 0.5 * (r + x / r);
            return r;
          }
          void qsort(void *base, size_t nmemb, size_t size, int (*compar)(const void *, const void *)) {
            char *arr = (char *)base;
            for (size_t i = 1; i < nmemb; i++) {
              size_t j = i;
              while (j > 0 && compar(arr + (j - 1) * size, arr + j * size) > 0) {
                char *a = arr + (j - 1) * size;
                char *b = arr + j * size;
                for (size_t k = 0; k < size; k++) {
                  char t = a[k]; a[k] = b[k]; b[k] = t;
                }
                j--;
              }
            }
          }
          unsigned int __udivsi3_i4i(unsigned int n, unsigned int d) {
            if (d == 0) return 0;
            unsigned int q = 0, r = 0;
            for (int i = 0; i < 32; i++) {
              unsigned int carry = r >> 31;
              r = (r << 1) | (n >> 31);
              n <<= 1;
              q <<= 1;
              if (carry || r >= d) {
                r -= d;
                q |= 1U;
              }
            }
            return q;
          }
          int __sdivsi3_i4i(int a, int b) {
            if (b == 0) return 0;
            int neg = (a < 0) ^ (b < 0);
            unsigned int ua = (a < 0) ? (0U - (unsigned int)a) : (unsigned int)a;
            unsigned int ub = (b < 0) ? (0U - (unsigned int)b) : (unsigned int)b;
            unsigned int uq = __udivsi3_i4i(ua, ub);
            return neg ? (int)(0U - uq) : (int)uq;
          }
          EOF
          LDSCRIPT=$(find /tmp/libfxcg -name "prizm.x" | head -n 1)
          LIBDIR=$(dirname $(find /tmp/libfxcg -name "libfxcg.a" | head -n 1))
          prizm-gcc -m4a-nofpu -mb -O2 -fno-builtin -I/tmp/libfxcg/include -c main.c -o main.o
          prizm-gcc -m4a-nofpu -mb -O2 -fno-builtin -c /tmp/math_shim.c -o /tmp/math_shim.o
          prizm-gcc -m4a-nofpu -mb -T"$LDSCRIPT" -Wl,-static -nostdlib main.o /tmp/math_shim.o -L"$LIBDIR" -Wl,--start-group -lfxcg -lc -lgcc -Wl,--end-group -o VIGAS.bin
          if [ -f /tmp/mkg3a/build/mkg3a ]; then
            /tmp/mkg3a/build/mkg3a -n basic:VIGAS VIGAS.bin VIGAS.g3a
          else
            prizm-objcopy -O binary VIGAS.bin VIGAS_raw.bin
            python3 -c '
          import struct
          raw = open("VIGAS_raw.bin", "rb").read()
          raw += b"\xFF" * ((4 - len(raw) % 4) % 4)
          hdr = bytearray(b"\xFF" * 0x7000)
          hdr[0:8] = bytes([b ^ 0xFF for b in b"USBPower"])
          hdr[8:16] = b"\xFE\xFF\xFF\xFF\xFF\xFF\x00\xFE"
          total = 0x7000 + len(raw)
          hdr[0x10:0x14] = struct.pack(">I", total ^ 0xFFFFFFFF)
          hdr[0x30:0x36] = b"@VIGAS"
          hdr[0x40:0x4A] = b"01.00.0000"
          hdr[0x50:0x5E] = b"2026.1124.0821"
          for off in range(0x5C60, 0x5C60 + 8*24, 24):
              hdr[off:off+5] = b"VIGAS"
          hdr[0x6FF4:0x6FF8] = struct.pack(">I", len(raw))
          hdr[0x20:0x24] = b"\x00\x00\x00\x00"
          csum = (sum(hdr[0:0x20]) + sum(hdr[0x24:]) + sum(raw)) & 0xFFFFFFFF
          hdr[0x20:0x24] = struct.pack(">I", csum)
          open("VIGAS.g3a", "wb").write(hdr + raw)
          '
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: VIGAS-fxCG50
          path: VIGAS.g3a
