name: Compilar G3A
on: [push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Instalar compilador y librerias fx-CG50
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-sh-elf binutils-sh-elf build-essential
          for tool in gcc g++ ar as ld objcopy ranlib strip; do
            sudo ln -sf /usr/bin/sh-elf-$tool /usr/local/bin/prizm-$tool
          done
          git clone https://github.com/gbl08ma/libfxcg.git /tmp/libfxcg
          make -C /tmp/libfxcg
      - name: Compilar VIGAS.g3a
        run: |
          cat << 'EOF' > /tmp/math_shim.h
          #ifndef MATH_SHIM_H
          #define MATH_SHIM_H
          double fabs(double x);
          double round(double x);
          double sqrt(double x);
          #endif
          EOF
          cat << 'EOF' > /tmp/math_shim.c
          #include <stddef.h>
          double fabs(double x) { return x < 0.0 ? -x : x; }
          double round(double x) { return x >= 0.0 ? (double)(long long)(x + 0.5) : (double)(long long)(x - 0.5); }
          double sqrt(double x) {
            if (x <= 0.0) return 0.0;
            double r = x > 1.0 ? x : 1.0;
            for (int i = 0; i < 30; i++) r = 0.5 * (r + x / r);
            return r;
          }
          void qsort(void *base, size_t nmemb, size_t size, int (*compar)(const void *, const void *)) {
            char *arr = (char *)base;
            for (size_t i = 1; i < nmemb; i++) {
              size_t j = i;
              while (j > 0 && compar(arr + (j - 1) * size, arr + j * size) > 0) {
                char *a = arr + (j - 1) * size;
                char *b = arr + j * size;
                for (size_t k = 0; k < size; k++) {
                  char t = a[k]; a[k] = b[k]; b[k] = t;
                }
                j--;
              }
            }
          }
          unsigned int __udivsi3_i4i(unsigned int n, unsigned int d) {
            if (d == 0) return 0;
            unsigned int q = 0, r = 0;
            for (int i = 0; i < 32; i++) {
              unsigned int carry = r >> 31;
              r = (r << 1) | (n >> 31);
              n <<= 1;
              q <<= 1;
              if (carry || r >= d) {
                r -= d;
                q |= 1U;
              }
            }
            return q;
          }
          int __sdivsi3_i4i(int a, int b) {
            if (b == 0) return 0;
            int neg = (a < 0) ^ (b < 0);
            unsigned int ua = (a < 0) ? (0U - (unsigned int)a) : (unsigned int)a;
            unsigned int ub = (b < 0) ? (0U - (unsigned int)b) : (unsigned int)b;
            unsigned int uq = __udivsi3_i4i(ua, ub);
            return neg ? (int)(0U - uq) : (int)uq;
          }
          EOF
          LDSCRIPT=$(find /tmp/libfxcg -name "prizm.x" | head -n 1)
          LIBDIR=$(dirname $(find /tmp/libfxcg -name "libfxcg.a" | head -n 1))
          prizm-gcc -m4a-nofpu -mb -O2 -fno-builtin -include /tmp/math_shim.h -I/tmp/libfxcg/include -c main.c -o main.o
          prizm-gcc -m4a-nofpu -mb -O2 -fno-builtin -c /tmp/math_shim.c -o /tmp/math_shim.o
          prizm-gcc -m4a-nofpu -mb -T"$LDSCRIPT" -Wl,-static -nostdlib main.o /tmp/math_shim.o -L"$LIBDIR" -Wl,--start-group -lfxcg -lc -lgcc -Wl,--end-group -o VIGAS.bin
          if head -c 4 VIGAS.bin | grep -q $'\x7fELF'; then
            prizm-objcopy -O binary VIGAS.bin VIGAS_raw.bin
          else
            cp VIGAS.bin VIGAS_raw.bin
          fi
          python3 -c '
          import struct
          raw = open("VIGAS_raw.bin", "rb").read()
          raw += b"\x00" * ((4 - len(raw) % 4) % 4)
          hdr = bytearray(0x7000)
          hdr[0x00:0x08] = bytes([b ^ 0xFF for b in b"USBPower"])
          hdr[0x08:0x10] = b"\xFE\xFF\xFF\xFF\xFF\xFF\x00\xFE"
          total = 0x7000 + len(raw)
          hdr[0x10:0x14] = struct.pack(">I", total ^ 0xFFFFFFFF)
          csum_hdr = sum(hdr[0x00:0x14]) & 0xFFFFFFFF
          hdr[0x14:0x18] = struct.pack(">I", csum_hdr ^ 0xFFFFFFFF)
          hdr[0x30:0x37] = b"@VIGAS\x00"
          hdr[0x40:0x4B] = b"01.00.0000\x00"
          hdr[0x50:0x5F] = b"2026.1124.0835\x00"
          for i in range(8):
              off = 0x60 + i * 24
              hdr[off:off+6] = b"VIGAS\x00"
          def make_icon(selected):
              bg = 0x001F if selected else 0xFFFF
              fg = 0xFFFF if selected else 0x001F
              sup = 0xFFE0 if selected else 0xF800
              buf = bytearray(92 * 64 * 2)
              for y in range(64):
                  for x in range(92):
                      c = bg
                      if x < 2 or x >= 90 or y < 2 or y >= 62:
                          c = fg
                      elif 26 <= y <= 31 and 12 <= x <= 80:
                          c = fg
                      elif 32 <= y <= 44 and (abs(x - 16) <= (y - 32) // 2 or abs(x - 76) <= (y - 32) // 2):
                          c = sup
                      struct.pack_into(">H", buf, (y * 92 + x) * 2, c)
              return buf
          hdr[0x1000:0x3E00] = make_icon(False)
          hdr[0x4000:0x6E00] = make_icon(True)
          hdr[0x6FF4:0x6FF8] = struct.pack(">I", len(raw))
          csum_body = (sum(hdr[0x24:]) + sum(raw)) & 0xFFFFFFFF
          hdr[0x20:0x24] = struct.pack(">I", csum_body)
          open("VIGAS.g3a", "wb").write(hdr + raw)
          '
      - uses: actions/upload-artifact@v4
        with:
          name: VIGAS-fxCG50
          path: VIGAS.g3a
